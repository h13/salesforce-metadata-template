name: CI

on:
  pull_request:
    branches: [main, sandbox]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  check:
    uses: h13/.github/.github/workflows/ci-node.yml@45ae44352fb1132ea3d2d09a7db128532062491f # v1

  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '>=11'
          distribution: 'zulu'

      - run: pnpm install --frozen-lockfile

      - name: Install Code Analyzer plugin
        run: pnpm exec sf plugins install code-analyzer@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@318e7429b49b97904dc41f7acbd41003db403965 # v2.14.0
        with:
          run-arguments: --workspace . --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: Fail on Critical or High severity violations
        if: |
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-sev2-violations > 0
        run: exit 1

  validate:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    needs: [check, code-analysis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Sandbox
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_USERNAME: ${{ secrets.SF_SANDBOX_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_SANDBOX_INSTANCE_URL }}
        run: |
          echo "$SF_JWT_KEY" > server.key
          pnpm exec sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias sandbox
          rm server.key

      - name: Validate deployment (dry-run)
        run: pnpm exec sf project deploy start --dry-run --target-org sandbox --wait 30

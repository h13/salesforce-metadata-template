name: CI

on:
  pull_request:
    branches: [main, sandbox]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  check:
    uses: h13/.github/.github/workflows/ci-node.yml@45ae44352fb1132ea3d2d09a7db128532062491f # v1

  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '>=11'
          distribution: 'zulu'

      - run: pnpm install --frozen-lockfile

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@318e7429b49b97904dc41f7acbd41003db403965 # v2.14.0
        with:
          run-arguments: --workspace force-app --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: Fail on any violations
        if: steps.run-code-analyzer.outputs.num-violations > 0
        run: exit 1

  validate:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    needs: [check]
    # Uses the sandbox environment's SF_JWT_KEY / SANDBOX_ID; connection values
    # are derived from production-origin repository variables (docs/jwt-auth-setup.md)
    environment: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # sfdx-git-delta diffs against the PR base, which a shallow clone
          # may not contain
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Validate the same shape a merge will deploy: the delta against the
      # merge base, deletions included (issues #51, #62)
      - name: Compute delta
        id: delta
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/sgd"
          mkdir -p "$OUT"
          echo "dir=$OUT" >>"$GITHUB_OUTPUT"
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          pnpm exec sf plugins link ./node_modules/sfdx-git-delta
          pnpm exec sf sgd source delta --from "$BASE" --to HEAD --output-dir "$OUT"
          HAS_CHANGES=false
          HAS_DELETIONS=false
          grep -q '<members>' "$OUT/package/package.xml" && HAS_CHANGES=true
          grep -q '<members>' "$OUT/destructiveChanges/destructiveChanges.xml" && HAS_DELETIONS=true
          echo "has-changes=$HAS_CHANGES" >>"$GITHUB_OUTPUT"
          echo "has-deletions=$HAS_DELETIONS" >>"$GITHUB_OUTPUT"
          {
            echo "## Metadata changes in this PR"
            echo '```xml'
            cat "$OUT/package/package.xml"
            echo '```'
            if [ "$HAS_DELETIONS" = "true" ]; then
              echo "### Deletions"
              echo '```xml'
              cat "$OUT/destructiveChanges/destructiveChanges.xml"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Sandbox
        if: steps.delta.outputs.has-changes == 'true' || steps.delta.outputs.has-deletions == 'true'
        env:
          SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
          SF_CI_USERNAME: ${{ vars.SF_CI_USERNAME }}
          SANDBOX_ID: ${{ vars.SANDBOX_ID }}
        run: |
          # Without SANDBOX_ID the derivation would point at production, so stop
          if [ -z "$SANDBOX_ID" ]; then
            echo "::error::SANDBOX_ID is not set on the sandbox environment"
            exit 1
          fi
          SF_USERNAME="${SF_CI_USERNAME}.${SANDBOX_ID}"
          SF_INSTANCE_URL="https://${SF_MY_DOMAIN}--${SANDBOX_ID}.sandbox.my.salesforce.com"
          echo "$SF_JWT_KEY" > server.key
          pnpm exec sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias sandbox
          rm server.key

      - name: Validate deployment (dry-run)
        env:
          HAS_CHANGES: ${{ steps.delta.outputs.has-changes }}
          HAS_DELETIONS: ${{ steps.delta.outputs.has-deletions }}
          SGD_DIR: ${{ steps.delta.outputs.dir }}
        shell: bash
        run: |
          if [ "$HAS_CHANGES" != "true" ] && [ "$HAS_DELETIONS" != "true" ]; then
            echo "No metadata changes in this PR; skipping the dry-run"
            exit 0
          fi
          ARGS=(--manifest "$SGD_DIR/package/package.xml")
          if [ "$HAS_DELETIONS" = "true" ]; then
            ARGS+=(--post-destructive-changes "$SGD_DIR/destructiveChanges/destructiveChanges.xml" --ignore-warnings)
          fi
          pnpm exec sf project deploy start --dry-run --target-org sandbox --wait 30 "${ARGS[@]}"

name: Deploy

on:
  push:
    branches: [sandbox, main]
  workflow_dispatch:
    inputs:
      test-level:
        description: 'Override the test level (policy = RunLocalTests on main, NoTestRun on sandbox)'
        type: choice
        options: [policy, NoTestRun, RunLocalTests, RunSpecifiedTests, RunAllTestsInOrg]
        default: policy
      tests:
        description: 'Comma-separated Apex test classes (required with RunSpecifiedTests)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    # Full refs, not ref_name: a tag named "main" must not select production
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'sandbox' }}
    steps:
      # workflow_dispatch can target any ref (including tags); deploys only
      # ever run from the two branches that map to orgs, so refuse everything else
      - name: Refuse refs that do not map to an org
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/sandbox'
        run: |
          echo "::error::deploys run only from the main or sandbox branch (got: $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate
        env:
          SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
          SF_CI_USERNAME: ${{ vars.SF_CI_USERNAME }}
          SANDBOX_ID: ${{ vars.SANDBOX_ID }}
        run: |
          # A SANDBOX_ID / environment mismatch would derive an unintended org, so stop
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ -z "$SANDBOX_ID" ]; then
            echo "::error::SANDBOX_ID is not set on the sandbox environment"
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$SANDBOX_ID" ]; then
            echo "::error::production environment must not define SANDBOX_ID"
            exit 1
          fi
          SF_USERNAME="${SF_CI_USERNAME}${SANDBOX_ID:+.$SANDBOX_ID}"
          if [ -n "$SANDBOX_ID" ]; then
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}--${SANDBOX_ID}.sandbox.my.salesforce.com"
          else
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}.my.salesforce.com"
          fi
          echo "$SF_JWT_KEY" > server.key
          pnpm exec sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias target-org
          rm server.key

      - name: Deploy
        env:
          TEST_LEVEL: ${{ inputs.test-level || 'policy' }}
          TESTS: ${{ inputs.tests }}
        run: |
          # Explicit test level so behaviour never rides on Salesforce defaults:
          # production (main) runs local tests, sandbox runs none
          if [ "$TEST_LEVEL" = "policy" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              TEST_LEVEL=RunLocalTests
            else
              TEST_LEVEL=NoTestRun
            fi
          fi
          # Overrides may strengthen the production gate, never weaken it
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$TEST_LEVEL" = "NoTestRun" ]; then
            echo "::error::NoTestRun is not allowed for production deploys"
            exit 1
          fi
          ARGS=(--test-level "$TEST_LEVEL")
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            if [ -z "$TESTS" ]; then
              echo "::error::the tests input is required with RunSpecifiedTests"
              exit 1
            fi
            IFS=',' read -ra TEST_CLASSES <<<"$TESTS"
            for t in "${TEST_CLASSES[@]}"; do
              ARGS+=(--tests "$t")
            done
          fi
          echo "Deploying with --test-level $TEST_LEVEL"
          pnpm exec sf project deploy start --target-org target-org --wait 30 "${ARGS[@]}"

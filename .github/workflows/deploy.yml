name: Deploy

on:
  push:
    branches: [sandbox, main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # sfdx-git-delta diffs against the pre-push commit, which a shallow
          # clone may not contain
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deletions in Git must reach the org: generate destructiveChanges.xml
      # for the pushed commit range (docs: issue #62)
      - name: Detect deletions
        id: deletions
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/sgd"
          mkdir -p "$OUT"
          echo "dir=$OUT" >>"$GITHUB_OUTPUT"
          # Branch creation and force pushes have no reliable base commit
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "::notice::No valid base commit; skipping deletion detection for this run"
            echo "has-deletions=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec sf plugins link ./node_modules/sfdx-git-delta
          pnpm exec sf sgd source delta --from "$BEFORE" --to "$GITHUB_SHA" --output-dir "$OUT"
          if grep -q '<members>' "$OUT/destructiveChanges/destructiveChanges.xml"; then
            echo "has-deletions=true" >>"$GITHUB_OUTPUT"
            {
              echo "## Deletions in this deploy"
              echo '```xml'
              cat "$OUT/destructiveChanges/destructiveChanges.xml"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "has-deletions=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Authenticate
        env:
          SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
          SF_CI_USERNAME: ${{ vars.SF_CI_USERNAME }}
          SANDBOX_ID: ${{ vars.SANDBOX_ID }}
        run: |
          # A SANDBOX_ID / environment mismatch would derive an unintended org, so stop
          if [ "$GITHUB_REF_NAME" != "main" ] && [ -z "$SANDBOX_ID" ]; then
            echo "::error::SANDBOX_ID is not set on the sandbox environment"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$SANDBOX_ID" ]; then
            echo "::error::production environment must not define SANDBOX_ID"
            exit 1
          fi
          SF_USERNAME="${SF_CI_USERNAME}${SANDBOX_ID:+.$SANDBOX_ID}"
          if [ -n "$SANDBOX_ID" ]; then
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}--${SANDBOX_ID}.sandbox.my.salesforce.com"
          else
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}.my.salesforce.com"
          fi
          echo "$SF_JWT_KEY" > server.key
          pnpm exec sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias target-org
          rm server.key

      - name: Deploy
        env:
          HAS_DELETIONS: ${{ steps.deletions.outputs.has-deletions }}
          SGD_DIR: ${{ steps.deletions.outputs.dir }}
        shell: bash
        run: |
          if [ "$HAS_DELETIONS" = "true" ]; then
            # Destructive changes require a manifest deploy; the generated
            # manifest spans all of force-app, so this is still a full deploy.
            # One atomic deploy: a deletion that breaks a dependency rolls
            # everything back. --ignore-warnings keeps re-runs idempotent
            # when a component is already gone from the org.
            pnpm exec sf project generate manifest \
              --source-dir force-app/main/default --output-dir "$RUNNER_TEMP/manifest"
            pnpm exec sf project deploy start --target-org target-org --wait 30 \
              --manifest "$RUNNER_TEMP/manifest/package.xml" \
              --post-destructive-changes "$SGD_DIR/destructiveChanges/destructiveChanges.xml" \
              --ignore-warnings
          else
            pnpm exec sf project deploy start --target-org target-org --wait 30
          fi

name: Deploy

on:
  push:
    branches: [sandbox, main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate
        env:
          SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
          SF_CI_USERNAME: ${{ vars.SF_CI_USERNAME }}
          SANDBOX_ID: ${{ vars.SANDBOX_ID }}
        run: |
          # A SANDBOX_ID / environment mismatch would derive an unintended org, so stop
          if [ "$GITHUB_REF_NAME" != "main" ] && [ -z "$SANDBOX_ID" ]; then
            echo "::error::SANDBOX_ID is not set on the sandbox environment"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$SANDBOX_ID" ]; then
            echo "::error::production environment must not define SANDBOX_ID"
            exit 1
          fi
          SF_USERNAME="${SF_CI_USERNAME}${SANDBOX_ID:+.$SANDBOX_ID}"
          if [ -n "$SANDBOX_ID" ]; then
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}--${SANDBOX_ID}.sandbox.my.salesforce.com"
          else
            SF_INSTANCE_URL="https://${SF_MY_DOMAIN}.my.salesforce.com"
          fi
          echo "$SF_JWT_KEY" > server.key
          pnpm exec sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias target-org
          rm server.key

      - name: Deploy
        run: pnpm exec sf project deploy start --target-org target-org --wait 30
